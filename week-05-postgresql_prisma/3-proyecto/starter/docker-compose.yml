services:
  postgres:
    image: postgres:16-alpine
    container_name: club-social-s05-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: club_social_s05
    ports:
      - "5432:5432"
    volumes:
      - club_social_s05_data:/var/lib/postgresql/data
volumes:
  club_social_s05_data:
